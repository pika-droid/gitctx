# Configuration for cargo-deny (https://github.com/EmbarkStudios/cargo-deny)

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0008", reason = "git2 0.19.0 Buf deref unsoundness; pinned for libgit2 stability" },
    { id = "RUSTSEC-2026-0183", reason = "git2 0.19.0 Remote::list null pointer; pinned for libgit2 stability" },
    { id = "RUSTSEC-2026-0184", reason = "git2 0.19.0 BlameHunk null pointer; pinned for libgit2 stability" },
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5 IterMut stacked borrows; transitive via tantivy 0.22" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.12.5 LruCache::pop panic safety; transitive via tantivy 0.22" },
    { id = "RUSTSEC-2026-0009", reason = "time 0.3.36 stack exhaustion in RFC2822 parsing; transitive via tantivy 0.22, patched time requires rustc >= 1.88" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # libgit2 linking exception / GPLv2 with exception
    { allow = ["GPL-2.0-only WITH GCC-exception-2.0", "GPL-2.0 WITH Classpath-exception-2.0"], name = "libgit2-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
