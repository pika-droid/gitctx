name: CI

on:
  push:
    branches: [ main, master, phase12 ]
  pull_request:
    branches: [ main, master, phase12 ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Lint, Test & Matrix Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        rust: [ stable ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Download ONNX Runtime
        run: cargo run -p xtask -- download-ort-runtime

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run xtask lint verification
        run: cargo run -p xtask -- lint

      - name: Run invariant verification suite
        run: cargo run -p xtask -- test-invariants

  audit-and-dependencies:
    name: Security, Dependencies & SemVer Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo quality & security tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-machete,cargo-semver-checks

      - name: Check unused dependencies (cargo-machete)
        run: cargo machete

      - name: Check licenses, bans & advisories (cargo-deny)
        run: cargo deny check

      - name: Security audit vulnerabilities (cargo-audit)
        run: cargo audit

      - name: Check SemVer compatibility (cargo-semver-checks)
        if: github.event_name == 'pull_request'
        run: cargo semver-checks check-release --baseline-rev ${{ github.base_ref || 'origin/main' }} || true
