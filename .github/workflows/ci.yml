name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Lint, Test & Matrix Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        rust: [ stable ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace tests
        run: cargo test --workspace --no-run

      - name: Locate and Set ONNX Runtime for Tests
        shell: bash
        run: |
          # Copy the ONNX runtime binaries directly into the deps directory where test executables run
          mkdir -p target/debug/deps
          find target/debug/build -type f -name "*onnxruntime*" \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) -exec cp {} target/debug/deps/ \;
          
          # Also set ORT_DYLIB_PATH as an explicit fallback for the ort crate
          ORT_LIB=$(find target/debug/deps -type f -name "*onnxruntime*" \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) | head -n 1)
          if [ -n "$ORT_LIB" ]; then
            echo "ORT_DYLIB_PATH=$PWD/$ORT_LIB" >> $GITHUB_ENV
          fi

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run xtask lint verification
        run: cargo run -p xtask -- lint
