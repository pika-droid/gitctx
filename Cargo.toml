[workspace]
resolver = "2"
members = [
    "crates/gitctx-core",
    "crates/gitctx-index",
    "crates/gitctx-query",
    "crates/gitctx-cli",
    "crates/gitctx-mcp",
    "crates/gitctx-eval",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["gitctx contributors"]
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
unnecessary_wraps = "allow"

[workspace.dependencies]
# Internal workspace crates
gitctx-core = { path = "crates/gitctx-core" }
gitctx-index = { path = "crates/gitctx-index" }
gitctx-query = { path = "crates/gitctx-query" }
gitctx-eval = { path = "crates/gitctx-eval" }

# External audited dependencies
git2 = { version = "0.19.0", default-features = false, features = ["vendored-libgit2"] }
tempfile = "3.16.0"
clap = { version = "4.5.26", features = ["derive"] }
thiserror = "2.0.11"
anyhow = "1.0.95"
blake3 = { version = "1.5.5", features = ["serde"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
toml = "0.8.20"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
