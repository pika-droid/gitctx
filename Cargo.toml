[workspace]
resolver = "2"
members = [
    "crates/gitctx-core",
    "crates/gitctx-index",
    "crates/gitctx-query",
    "crates/gitctx-cli",
    "crates/gitctx-mcp",
    "crates/gitctx-eval",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
authors = ["gitctx contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pika-droid/gitctx"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
unnecessary_wraps = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_field_names = "allow"
unreadable_literal = "allow"
match_same_arms = "allow"
float_cmp = "allow"
map_unwrap_or = "allow"
format_push_string = "allow"
explicit_iter_loop = "allow"

[workspace.dependencies]
# Internal workspace crates
gitctx-core = { path = "crates/gitctx-core" }
gitctx-index = { path = "crates/gitctx-index" }
gitctx-query = { path = "crates/gitctx-query" }
gitctx-eval = { path = "crates/gitctx-eval" }

# External audited dependencies
git2 = { version = "0.19.0", default-features = false, features = ["vendored-libgit2"] }
tempfile = "3.16.0"
clap = { version = "4.5.26", features = ["derive"] }
thiserror = "2.0.11"
anyhow = "1.0.95"
blake3 = { version = "1.5.5", features = ["serde"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
toml = "0.8.20"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
regex = "1.11.1"
sha2 = "0.10.8"
lru = "0.13"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-php = "0.23"
rusqlite = { version = "0.32.1", features = ["bundled"] }
crossbeam-channel = "0.5.16"
tantivy = "0.22.0"
fastembed = { version = "=5.6.0", default-features = false, features = ["ort-load-dynamic", "hf-hub-native-tls"] }
ort = { version = "=2.0.0-rc.10", features = ["load-dynamic"] }
memmap2 = "0.9.5"
rayon = "1.10.0"
petgraph = "0.7"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"


